name: Bug Report
description: Report a bug or unexpected behavior in ShellMaster3
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please sanitize any private hostnames, passwords, or keys before pasting logs.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to trigger the issue.
      placeholder: |
        1. Connect to server via ...
        2. Open SFTP / Terminal / Port Forwarding ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
  - type: input
    id: version
    attributes:
      label: ShellMaster3 Version
      placeholder: e.g. v0.0.1 or commit hash
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows (x64)
        - Linux (x64)
        - Linux (ARM64)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs (Optional)
      description: You can run with `RUST_LOG=shellmaster3=debug` to capture detailed logs. Remove sensitive information before pasting.
      render: shell
