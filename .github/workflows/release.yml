name: Release

# 推送形如 v0.1.0 的 tag 时触发；也可在 Actions 页面手动触发。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # 创建 Release / 上传产物需要

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    # 单个平台失败/超时不阻塞整体 release（配合 matrix.experimental）。
    # macOS Intel(macos-13) runner 经常长时间排不到队，设为不阻塞。
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-14
            formats: dmg
          - label: macOS (Intel)
            os: macos-13
            formats: dmg
            experimental: true
          - label: Windows
            os: windows-latest
            formats: nsis
          - label: Linux
            os: ubuntu-22.04
            formats: deb,appimage

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # GPUI 在 Linux 的构建/运行依赖；AppImage 需要 FUSE。
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libssl-dev \
            libxcb1-dev \
            libvulkan-dev \
            libfuse2 \
            cmake \
            clang

      - name: Install cargo-packager
        uses: cargo-bins/cargo-binstall@main

      - run: cargo binstall --no-confirm cargo-packager

      # before-packaging-command (Cargo.toml) 会先执行 `cargo build --release`，
      # 因此这里以 --release 运行；产物统一输出到 dist/。
      #
      # macOS：通过 APPLE_SIGNING_IDENTITY="-" 让 cargo-packager 对 .app 做 ad-hoc 签名。
      # 这样 .app bundle 的签名是自洽的，可把下载后的报错从死路一条的“已损坏，移到废纸篓”
      # 降级为可恢复的“无法验证开发者 / 仍要打开”。
      # 注意：ad-hoc 未经 Apple 公证，用户首次仍需执行 `xattr -rd com.apple.quarantine`
      # 去隔离（见 README）。该环境变量在 Windows/Linux 上会被忽略。
      - name: Package
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: cargo packager --release --formats ${{ matrix.formats }} --out-dir dist

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.msi
            dist/*.deb
            dist/*.AppImage

      # 非 tag（手动）触发时，把产物存为 workflow artifact 方便下载验证。
      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: shellmaster3-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.msi
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: ignore
